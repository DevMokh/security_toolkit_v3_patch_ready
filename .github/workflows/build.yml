name: Android Release APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm Flutter project root
        shell: bash
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          if [[ ! -f pubspec.yaml || ! -f lib/main.dart || ! -f scripts/bootstrap_android.sh ]]; then
            echo "ERROR: GitHub Actions is not running from the Security Toolkit project root."
            echo "Expected pubspec.yaml, lib/main.dart and scripts/bootstrap_android.sh in the repository root."
            echo "Discovered pubspec.yaml files (first 20):"
            find . -maxdepth 5 -name pubspec.yaml -print | head -20 || true
            exit 1
          fi
          echo "Flutter project root confirmed."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          java -version

      - name: Regenerate Android host project with V2 embedding
        run: bash scripts/bootstrap_android.sh

      - name: Verify Android embedding before dependency/build steps
        run: python3 scripts/verify_android_embedding.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Confirm APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: security-toolkit-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
